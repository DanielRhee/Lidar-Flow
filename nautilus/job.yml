apiVersion: batch/v1
kind: Job
metadata:
  name: djrhee-lidarflow-train-v100
  namespace: gilpin-lab
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: djrhee-lidarflow-train
        image: ghcr.io/selkies-project/nvidia-glx-desktop:24.04-20240924062704
        env:
        - name: HOME
          value: /home/ubuntu
        - name: PYTHONUNBUFFERED
          value: "1"
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          . ~/persistent/start.sh || true
          source ~/miniconda3/etc/profile.d/conda.sh

          if ! conda env list | grep -q "^lidarflow "; then
            conda config --add channels conda-forge
            conda env create -f ~/persistent/python/lidarflow.yml --name lidarflow
          fi

          cd ~/persistent/djrhee/Lidar-Flow
          git checkout -- .
          git pull --rebase

          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          conda run --no-capture-output -n lidarflow python codebase/submit.py \
            --checkpoint ~/persistent/djrhee/Lidar-Flow/runs/run_20260508_153657/best.pt \
            --split test \
            --voxelSize 0.1 \
            --outDir ~/persistent/djrhee/Lidar-Flow/submissions/submission_${TIMESTAMP}
        resources:
          limits:
            memory: 12Gi
            cpu: "8"
            nvidia.com/gpu: "1"
            ephemeral-storage: 20Gi
          requests:
            memory: 12Gi
            cpu: "8"
            nvidia.com/gpu: "1"
            ephemeral-storage: 12Gi
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /home/ubuntu/persistent
          name: root-vol
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 8.8.8.8
        - 8.8.4.4
      volumes:
      - name: dshm
        emptyDir: {}
      - name: root-vol
        persistentVolumeClaim:
          claimName: lidarflow-challenge
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: NotIn
                values:
                - ucsd-suncave
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - Tesla-V100-SXM2-16GB