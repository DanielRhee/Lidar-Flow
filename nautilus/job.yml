apiVersion: batch/v1
kind: Job
metadata:
  name: djrhee-lidarflow-eval-v100
  namespace: gilpin-lab
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: djrhee-lidarflow-eval
        image: ghcr.io/selkies-project/nvidia-glx-desktop:24.04-20240924062704
        env:
        - name: HOME
          value: /home/ubuntu
        - name: PYTHONUNBUFFERED
          value: "1"
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          . ~/persistent/start.sh || true
          source ~/miniconda3/etc/profile.d/conda.sh

          if ! conda env list | grep -q "^lidarflow "; then
            conda config --add channels conda-forge
            conda env create -f ~/persistent/python/lidarflow.yml --name lidarflow
          fi

          cd ~/persistent/djrhee/Lidar-Flow
          git checkout -- .
          git pull --rebase

          conda run --no-capture-output -n lidarflow python -m pip install -q scipy pandas pyarrow

          CKPT_A=$(ls -t ~/persistent/djrhee/Lidar-Flow/runs/run_p2_*/best_nll.pt 2>/dev/null | head -1)
          CKPT_B=$(ls -t ~/persistent/djrhee/Lidar-Flow/runs/run_p3_*/best.pt 2>/dev/null | head -1)
          EVAL_DIR=~/persistent/djrhee/Lidar-Flow/runs/evaluation

          echo "Checkpoint A: ${CKPT_A}"
          echo "Checkpoint B: ${CKPT_B}"

          [ -z "${CKPT_A}" ] && echo "ERROR: no run_p2_*/best_nll.pt found" && exit 1
          [ -z "${CKPT_B}" ] && echo "ERROR: no run_p3_*/best.pt found" && exit 1

          mkdir -p "${EVAL_DIR}"

          conda run --no-capture-output -n lidarflow python codebase/evaluate.py \
            --checkpoint "${CKPT_A}" \
            --voxelSize 0.1 \
            --outFile "${EVAL_DIR}/dumpA.feather"

          conda run --no-capture-output -n lidarflow python codebase/evaluate.py \
            --checkpoint "${CKPT_B}" \
            --voxelSize 0.1 \
            --outFile "${EVAL_DIR}/dumpB.feather"

          conda run --no-capture-output -n lidarflow python codebase/analysis.py \
            --dumpA "${EVAL_DIR}/dumpA.feather" \
            --dumpB "${EVAL_DIR}/dumpB.feather" \
            --outDir "${EVAL_DIR}"
        resources:
          limits:
            memory: 12Gi
            cpu: "8"
            nvidia.com/gpu: "1"
            ephemeral-storage: 20Gi
          requests:
            memory: 12Gi
            cpu: "8"
            nvidia.com/gpu: "1"
            ephemeral-storage: 12Gi
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /home/ubuntu/persistent
          name: root-vol
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 8.8.8.8
        - 8.8.4.4
      volumes:
      - name: dshm
        emptyDir: {}
      - name: root-vol
        persistentVolumeClaim:
          claimName: lidarflow-challenge
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: NotIn
                values:
                - ucsd-suncave
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - Tesla-V100-SXM2-16GB